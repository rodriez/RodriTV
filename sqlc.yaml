version: "2"
sql:
  - engine: postgresql
    schema: migrations/
    queries: scripts/sqlc/channel.sql
    gen:
      go:
        package: channel
        out: internal/channel/
        sql_package: pgx/v5
        emit_json_tags: true
        rename:
          channel: ChannelRow
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: jsonb
            go_type: encoding/json.RawMessage
